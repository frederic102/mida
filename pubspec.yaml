name: mida
description: "MiDa - Media Downloader & Encoder"
publish_to: "none"

version: 2.4.0+7

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^8.2.1

  # State management
  provider: ^6.1.1

  # File handling
  path_provider: ^2.1.2
  file_picker: ^6.1.1

  # Utilities
  url_launcher: ^6.2.4
  shared_preferences: ^2.2.2
  path: ^1.9.0
  desktop_drop: ^0.7.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Agent CLI (no window): `dart run bin/mida_cli.dart <cmd>`, or `dart compile exe`
# for the installed mida-cli.exe. See docs/plan-phase7-coverage-agent.md.
executables:
  mida-cli: mida_cli

flutter:
  uses-material-design: true

  assets:
    - assets/binaries/
    - assets/logo.png
