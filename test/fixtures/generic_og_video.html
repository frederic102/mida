<!DOCTYPE html>
<html>
<head>
  <title>Fallback Title</title>
  <meta property="og:title" content="A Public Post" />
  <meta property="og:image" content="https://cdn.example.com/thumb.jpg" />
  <meta property="og:video:secure_url" content="https://cdn.example.com/videos/post-720.mp4" />
  <meta property="og:video:width" content="1280" />
  <meta property="og:video:height" content="720" />
  <meta name="twitter:player:stream" content="https://cdn.example.com/videos/post-720.mp4" />
</head>
<body>
  <p>No video tag here, only meta tags.</p>
</body>
</html>
